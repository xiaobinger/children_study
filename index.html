<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="description" content="儿童益智学习乐园 - 适合3到12岁孩子的古诗、识字、儿歌、课文、手工、数学趣味学习游戏，带护眼模式">
<title>儿童益智学习乐园</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎈</text></svg>">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="bgDeco" class="bg-deco"><span>🌈</span><span>⭐</span><span>🎈</span><span>🦋</span></div>
<div id="app">
  <header class="topbar">
    <button class="topbar-logo" data-nav="home" aria-label="回到首页">
      <span class="logo-icon">🎈</span>
      <span class="logo-text">学习乐园</span>
    </button>
    <button class="topbar-age" id="ageBtn" aria-label="切换年龄段">
      <span id="ageBtnText">3-4岁</span>
    </button>
    <div class="topbar-right">
      <div class="star-chip" id="starChip" title="我获得的星星">
        <span class="star-icon">⭐</span>
        <span id="starCount">0</span>
      </div>
      <button class="icon-btn" id="soundBtn" aria-label="声音开关" title="声音开关">🔊</button>
      <button class="icon-btn" id="eyeBtn" aria-label="护眼模式" title="护眼模式">🌙</button>
      <button class="icon-btn" id="parentBtn" aria-label="家长中心" title="家长中心">⚙️</button>
    </div>
  </header>

  <main id="view" class="view" aria-live="polite">
    <!-- 路由视图渲染区 -->
  </main>

  <nav class="bottombar" id="bottombar">
    <button class="bottombar-item" data-nav="home"><span class="b-icon">🏠</span><span class="b-label">首页</span></button>
    <button class="bottombar-item" data-nav="poem"><span class="b-icon">📖</span><span class="b-label">古诗</span></button>
    <button class="bottombar-item" data-nav="math"><span class="b-icon">🔢</span><span class="b-label">数学</span></button>
    <button class="bottombar-item" data-nav="more"><span class="b-icon">✨</span><span class="b-label">更多</span></button>
  </nav>
</div>

<!-- 休息提醒遮罩 -->
<div class="overlay hidden" id="restOverlay">
  <div class="rest-card">
    <div class="rest-emoji">😴</div>
    <h2>小眼睛累啦</h2>
    <p>休息一会儿，看看窗外远一点的地方，<br>保护眼睛才能学到更多本领哦！</p>
    <div class="rest-timer" id="restTimer">20</div>
    <button class="btn btn-primary btn-big" id="restSkipBtn">我休息好啦，继续玩</button>
  </div>
</div>

<!-- 通用弹窗 -->
<div class="overlay hidden" id="modalOverlay">
  <div class="modal" id="modalBox"></div>
</div>

<!-- 撒花画布 -->
<canvas id="confettiCanvas"></canvas>
<button class="mascot" id="mascot" title="点我聊天！" aria-label="学习小伙伴">
  <span class="mascot-bubble" id="mascotBubble">你好呀！</span>
  <svg class="pet-svg" viewBox="0 0 120 120" aria-hidden="true" focusable="false" id="petSvg"></svg>
  <span class="pet-hit" aria-hidden="true"></span>
  <span class="pet-badge" id="petBadge" hidden>Lv.1</span>
</button>

<script src="js/data/poems.js"></script>
<script src="js/data/poems-a1.js"></script>
<script src="js/data/poems-a2.js"></script>
<script src="js/data/poems-a3.js"></script>
<script src="js/data/poems-a4.js"></script>
<script src="js/data/characters.js"></script>
<script src="js/data/chars-a1.js"></script>
<script src="js/data/chars-a2.js"></script>
<script src="js/data/chars-a3.js"></script>
<script src="js/data/chars-a4.js"></script>
<script src="js/data/songs.js"></script>
<script src="js/data/texts.js"></script>
<script src="js/data/stories.js"></script>
<script src="js/data/crafts.js"></script>
<script src="js/data/mathgen.js"></script>
<script src="js/data/cartoons.js"></script>
<script src="js/data/cartoon-recs.js"></script>
<script src="js/data/fun.js?v=1.5.0"></script>
<script src="js/voice-map.js"></script>
<script src="js/core.js"></script>
<script src="js/ai.js"></script>
<script src="js/audio.js"></script>
<script src="js/ui.js"></script>
<script src="js/modules/home.js"></script>
<script src="js/modules/poem.js"></script>
<script src="js/modules/literacy.js"></script>
<script src="js/modules/song.js"></script>
<script src="js/modules/text.js"></script>
<script src="js/modules/story.js"></script>
<script src="js/modules/craft.js"></script>
<script src="js/modules/math.js"></script>
<script src="js/modules/cartoon.js"></script>
<script src="js/modules/parent.js?v=1.5.0"></script>
<script src="js/animal.js"></script>
<script src="js/pet.js"></script>
<script src="js/xiaoai.js?v=1.5.0"></script>
<script src="js/main.js"></script>
</body>
</html>
